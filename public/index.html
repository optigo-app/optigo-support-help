<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <meta name="theme-color" content="#000000" />
    <title>Optigo Support Center</title>
    <meta name="description" content="Optigo Support Center provides clients and customers with fast, efficient help and resources to resolve issues, manage tickets, and get expert assistance." />
    <meta name="keywords" content="Optigo Support, Customer Support, Help Center, Ticket Management, Client Assistance, Technical Support, Knowledge Base" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Optigo Support Center" />
    <meta property="og:title" content="Optigo Support Center" />
    <meta property="og:description" content="Access client support, submit tickets, track issue resolution, and find helpful resources — all in one place." />
    <meta property="og:url" content="https://help.optigoapps.com/" />
    <link rel="icon" href="2.ico" />
    <!-- Automatic Recovery for Webpack ChunkLoadError / New Deploy Cache Invalidation -->
    <script>
      (function() {
        function triggerReload() {
          var KEY = 'last_chunk_reload_ts';
          var now = Date.now();
          var last = sessionStorage.getItem(KEY);
          // Only auto-reload if at least 10 seconds have elapsed, preventing loops
          if (!last || (now - parseInt(last, 10)) > 10000) {
            sessionStorage.setItem(KEY, String(now));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            var url = new URL(window.location.href);
            url.searchParams.set('_v', String(now));
            window.location.replace(url.toString());
          }
        }

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) || '';
          var target = e && e.target;
          var isChunkError = /loading chunk|loading css chunk/i.test(msg) ||
            (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') && /static\/(js|css)/i.test(target.src || target.href));
          if (isChunkError) {
            console.warn('[Webpack] Chunk load failure detected. Refreshing for new build...', msg);
            triggerReload();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && e.reason.message) || String(e && e.reason);
          if (/loading chunk|loading css chunk/i.test(reason)) {
            console.warn('[Webpack] Unhandled ChunkLoadError. Refreshing for new build...', reason);
            triggerReload();
          }
        });
      })();
    </script>
    <script src="%PUBLIC_URL%/version.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
